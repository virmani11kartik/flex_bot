# ── PRM Builder ───────────────────────────────────────────────────────────────
prm_builder:
  ros__parameters:
    samples: 200000               # number of random nodes to sample
    k_neighbors: 8              # PRM* connectivity target
    inflation_radius_m: 0.60    # obstacle inflation (robot radius + safety margin)
    occupied_threshold: 40      # occupancy value considered blocked
    allow_unknown: false
    seed: 0                     # 0 = random seed each run
    publish_inflated_map: true

# ── A* Planner ────────────────────────────────────────────────────────────────
astar_planner:
  ros__parameters:
    use_prm: true
    heuristic_weight: 1.0
    inflation_radius_m: 0.20
    allow_diagonal: true
    use_tf_start: true
    map_frame: "map"
    base_frame: "base_link"

# ── Waypoint Controller ───────────────────────────────────────────────────────
waypoint_controller:
  ros__parameters:
    # Robot geometry
    wheel_radius:     0.0765
    wheel_base:       0.5000
    max_wheel_rads:   3.0
    # Motion
    linear_speed:     0.15
    max_omega:        0.8
    goal_tolerance:   0.4
    final_tolerance:  0.10
    heading_kp:       1.2
    lookahead:        0.4
    slow_dist:        0.8
    min_speed:        0.04
    map_frame:        "map"
    base_frame:       "base_link"
    # CBF safety filter
    cbf_enabled:          true   # false = revert to pure pursuit instantly
    cbf_alpha:            1.0    # was 1.5 — less conservative
    r_robot:              0.30   # your robot footprint radius m
    cbf_influence_dist:   0.5    # ignore obstacles beyond this distance m
    cbf_forward_cone:     0.35    # cos(78°) — ignore obstacles outside forward cone
    cbf_path_half_width:  0.30   # lateral sweep width m — ignore far-side obstacles
    cbf_lookahead_t:      1.0    # lookahead time for omega steering correction s
    cbf_ttc_threshold:    5.0
