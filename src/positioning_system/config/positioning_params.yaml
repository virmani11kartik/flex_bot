pgv_dock_controller:
  ros__parameters:
    # Path to registered tag markers — update after colcon build
    markers_file: "/home/kartik/flex_bot/install/positioning_system/share/positioning_system/config/markers.json"

    # Distance from goal at which A* nav hands off to PGV docking
    dock_switch_dist_m: 0.5       # m

    # Docking success thresholds (tunable)
    dock_x_thresh_mm: 20.0        # mm — lateral deviation
    dock_y_thresh_mm: 20.0        # mm — forward deviation
    dock_angle_thresh_deg: 2.0    # degrees — heading error

    # Docking motion limits (slow and precise)
    dock_linear_speed: 0.06       # m/s
    dock_angular_speed: 0.3       # rad/s

    # Must match your robot's actual geometry
    wheel_radius: 0.076           # m
    wheel_base: 0.30              # m
    max_wheel_rads: 3.0           # rad/s hardware limit
