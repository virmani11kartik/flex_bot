pgv_dock_controller:
  ros__parameters:
    # Path to registered tag markers file
    markers_file: "/home/kartik/flex_bot/install/positioning_system/share/positioning_system/config/markers.json"

    # Distance at which A* nav hands off to PGV precision docking
    dock_switch_dist_m: 0.5

    # Docking success thresholds (tune to your needs)
    dock_x_thresh_mm: 20.0        # mm lateral deviation
    dock_y_thresh_mm: 20.0        # mm forward deviation
    dock_angle_thresh_deg: 2.0    # degrees heading error

    # Docking motion limits
    dock_linear_speed: 0.06       # m/s
    dock_angular_speed: 0.3       # rad/s

    # Robot geometry — must match waypoint_controller
    wheel_radius: 0.076
    wheel_base: 0.30
    max_wheel_rads: 3.0
